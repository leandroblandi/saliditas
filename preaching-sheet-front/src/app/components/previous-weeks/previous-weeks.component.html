<div class="previous-weeks-container">
  <h1>Salidas semanales anteriores</h1>
  <p class="sub-header">Consulta y exporta el historial de salidas de predicación previamente registradas.</p>

  <mat-card>
    <mat-card-content>
      <!-- Skeleton loading -->
      <app-skeleton-table 
        *ngIf="isLoading"
        [skeletonRows]="skeletonRows"
        [columns]="[1,2,3,4]">
      </app-skeleton-table>

      <!-- Empty State cuando no hay datos -->
      <app-empty-state 
        *ngIf="!isLoading && (!dataSource.data || dataSource.data.length === 0)"
        icon="history"
        title="No hay salidas semanales registradas"
        description="Aún no se han registrado salidas semanales. Las salidas aparecerán aquí una vez que sean creadas."
        [showAction]="true">
        
        <div empty-state-action>
          <button mat-raised-button color="primary" routerLink="/new-weekly">
            <mat-icon>add</mat-icon>
            Crear primera salida
          </button>
        </div>
      </app-empty-state>

      <!-- Tabla cuando hay datos -->
      <div *ngIf="!isLoading && dataSource.data && dataSource.data.length > 0">
        <table mat-table [dataSource]="dataSource" matSort class="weeks-table">
          <!-- Periodo -->
          <ng-container matColumnDef="period">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Periodo </th>
            <td mat-cell *matCellDef="let w">{{ w.startDate | date:'dd/MM' }} - {{ w.endDate | date:'dd/MM/yyyy' }}</td>
          </ng-container>

          <!-- Mes -->
          <ng-container matColumnDef="month">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Mes </th>
            <td mat-cell *matCellDef="let w">{{ w.monthName }}</td>
          </ng-container>

          <!-- Eventos -->
          <ng-container matColumnDef="events">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Eventos </th>
            <td mat-cell *matCellDef="let w">{{ w.preachingEvents?.length || 0 }}</td>
          </ng-container>

          <!-- Acciones -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let w">
              <div class="action-buttons">
                <button mat-stroked-button 
                        color="primary" 
                        [disabled]="isExportingExcel(w.id)"
                        (click)="export(w)">
                  <mat-spinner *ngIf="isExportingExcel(w.id)" 
                               diameter="16" 
                               class="button-spinner"></mat-spinner>
                  <mat-icon *ngIf="!isExportingExcel(w.id)">download</mat-icon>
                  <span [class.loading-text]="isExportingExcel(w.id)">
                    {{ isExportingExcel(w.id) ? 'Descargando...' : 'Exportar Excel' }}
                  </span>
                </button>
                <button mat-stroked-button 
                        color="accent" 
                        [disabled]="isExportingImage(w.id)"
                        (click)="exportToImage(w)">
                  <mat-spinner *ngIf="isExportingImage(w.id)" 
                               diameter="16" 
                               class="button-spinner"></mat-spinner>
                  <mat-icon *ngIf="!isExportingImage(w.id)">image</mat-icon>
                  <span [class.loading-text]="isExportingImage(w.id)">
                    {{ isExportingImage(w.id) ? 'Generando...' : 'Exportar Imagen' }}
                  </span>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="total" 
                       [pageSize]="pageSize" 
                       [pageIndex]="page" 
                       [pageSizeOptions]="[5, 10, 25, 50]"
                       showFirstLastButtons 
                       (page)="changePage($event)"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
